# 署名なしでコンパイルだけ確かめる。手動実行のみ。
name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: XcodeGen でプロジェクトを作る
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen generate

      - name: ビルド（署名なし）
        run: |
          xcodebuild build \
            -project WellSee.xcodeproj \
            -scheme WellSee \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: できあがった中身を確かめる
        run: |
          APP=build/Build/Products/Release-iphoneos/WellSee.app
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleDisplayName|CFBundleIdentifier|MinimumOSVersion|CFBundleVersion|ITSApp|UsageDescription'
          # 共有シート用の拡張が入っているか
          ls "$APP/PlugIns"
          plutil -p "$APP/PlugIns/WellSeeShare.appex/Info.plist" | grep -E 'CFBundleIdentifier|NSExtensionPointIdentifier|NSExtensionPrincipalClass'
