# アーカイブ → 権限を付ける → 署名 → TestFlight へアップロード。手動実行のみ。
# 必要な Secrets と、Apple 側で一度だけ行う準備は CLAUDE.md を参照。
name: testflight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # ビルド番号。実行のたびに 1 ずつ増える。
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Secrets がそろっているか確かめる
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name が登録されていません"; missing=1; fi
          done
          exit $missing

      - name: Xcode を選ぶ
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: XcodeGen でプロジェクトを作る
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen generate

      - name: API キーを置く
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      # 開発用の署名には登録済みの端末が要るため、アーカイブは署名なしで作り、
      # 書き出しのときに配布用の証明書（Apple 側で自動管理）で署名する。
      - name: アーカイブ（署名なし）
        run: |
          xcodebuild archive \
            -project WellSee.xcodeproj \
            -scheme WellSee \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WellSee.xcarchive" \
            -quiet \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO

      # 署名なしのアーカイブには権限（App Group）が入らない。そのまま書き出すと、
      # 共有シートからアプリへ受け渡す置き場が使えなくなる。
      # 証明書なしの仮署名で権限だけを付けておくと、書き出しのときに引き継がれる。
      # 拡張 → アプリ本体の順に付ける。
      - name: 権限（App Group）を付ける
        run: |
          APP="$RUNNER_TEMP/WellSee.xcarchive/Products/Applications/WellSee.app"
          codesign --force --sign - --entitlements WellSeeShare/WellSeeShare.entitlements "$APP/PlugIns/WellSeeShare.appex"
          codesign --force --sign - --entitlements WellSee/WellSee.entitlements "$APP"
          for target in "$APP/PlugIns/WellSeeShare.appex" "$APP"; do
            if ! codesign -d --entitlements - "$target" 2>/dev/null | grep -q "group.com.sawswork.wellsee"; then
              echo "::error::$target に App Group の権限が付いていません"; exit 1
            fi
          done

      - name: 署名して TestFlight へ送る
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WellSee.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API キーを消す
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
